services:
  web:
    build:
      context: ./web_system
      dockerfile: deploy/render/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      text-ai:
        condition: service_healthy
    expose:
      - "10000"
    environment:
      APP_NAME: AksyRes
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?Set APP_KEY in Dokploy}
      APP_URL: ${APP_URL:?Set APP_URL to the public HTTPS URL}
      LEGAL_OPERATOR_NAME: ${LEGAL_OPERATOR_NAME:-AksyRes project administrators}
      LEGAL_CONTACT_EMAIL: ${LEGAL_CONTACT_EMAIL:-}
      LEGAL_CONTACT_ADDRESS: ${LEGAL_CONTACT_ADDRESS:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      LOG_CHANNEL: stderr
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:-rescue}
      DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME in Dokploy}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in Dokploy}
      SESSION_DRIVER: database
      SESSION_COOKIE: stitch-rescue-web-session
      SESSION_SECURE_COOKIE: "true"
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      FILESYSTEM_DISK: local
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: ${REVERB_APP_ID:-tomas-oppus-rescue}
      REVERB_APP_KEY: ${REVERB_APP_KEY:?Set REVERB_APP_KEY in Dokploy}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:?Set REVERB_APP_SECRET in Dokploy}
      REVERB_HOST: ${REVERB_HOST:?Set REVERB_HOST to the public domain hostname}
      REVERB_PORT: "443"
      REVERB_SCHEME: https
      REVERB_SERVER_HOST: 127.0.0.1
      REVERB_SERVER_PORT: "8080"
      AI_SEVERITY_ENABLED: "false"
      # Supervised synthetic-trained pilot; every suggestion requires admin confirmation.
      # Set AI_TEXT_MODE=MANUAL_ONLY in Dokploy to roll back without losing reports.
      AI_TEXT_MODE: ${AI_TEXT_MODE:-MODEL_ADVISORY}
      AI_TEXT_ENABLED: ${AI_TEXT_ENABLED:-true}
      AI_TEXT_SERVICE_URL: http://text-ai:8100
      AI_TEXT_TEST_SERVICE_URL: http://text-ai:8100
      FACE_LIVENESS_SERVICE_URL: http://text-ai:8100
      AI_TEXT_ALLOW_EXPERIMENTAL: "true"
      # PHP image exports feedback; isolated Python worker trains candidates only.
      RUN_SCHEDULER: "true"
      AI_LEARNING_ENABLED: "false"
      AI_LEARNING_MIN_NEW: ${AI_LEARNING_MIN_NEW:-50}
      AI_LEARNING_TARGET_ACCURACY: ${AI_LEARNING_TARGET_ACCURACY:-0.8}
      AI_LEARNING_CRITICAL_RECALL: ${AI_LEARNING_CRITICAL_RECALL:-0.95}
      AI_LEARNING_MIN_CELL: ${AI_LEARNING_MIN_CELL:-5}
      LORA_INGEST_TOKEN: ${LORA_INGEST_TOKEN:?Set a unique LORA_INGEST_TOKEN in Dokploy}
      ROUTING_SERVICE_ENABLED: ${ROUTING_SERVICE_ENABLED:-true}
      ROUTING_SERVICE_URL: ${ROUTING_SERVICE_URL:-https://router.project-osrm.org}
      ROUTING_SERVICE_PROFILE: ${ROUTING_SERVICE_PROFILE:-driving}
      ROUTING_SERVICE_TIMEOUT: ${ROUTING_SERVICE_TIMEOUT:-8}
      MAIL_MAILER: ${MAIL_MAILER:-log}
      MAIL_SCHEME: ${MAIL_SCHEME:-null}
      MAIL_HOST: ${MAIL_HOST:-127.0.0.1}
      MAIL_PORT: ${MAIL_PORT:-2525}
      MAIL_USERNAME: ${MAIL_USERNAME:-null}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-null}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-hello@example.com}
      MAIL_FROM_NAME: AksyRes
    volumes:
      - app-storage:/var/www/html/storage/app
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:10000/system/version || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

  text-ai:
    build:
      context: ./ai_service
      dockerfile: deploy/render/Dockerfile
      args:
        INSTALL_TEXT_BASELINE: "true"
        INSTALL_FACE_LIVENESS: "true"
    restart: unless-stopped
    expose:
      - "8100"
    environment:
      AI_OPERATION_MODE: AI_ENABLED
      AI_TEXT_ENABLED: "true"
      AI_TEXT_ALLOW_EXPERIMENTAL: "true"
      AI_TEXT_MODEL_DIR: /app/releases/category-experts-20261112-v1
      AI_TEXT_RULES_ENABLED: ${AI_TEXT_RULES_ENABLED:-true}
      AI_SERVICE_PORT: "8100"
      FACE_LIVENESS_KEY: ${APP_KEY:?Set APP_KEY in Dokploy}
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    mem_limit: 768m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/ready/text', timeout=5); urllib.request.urlopen('http://127.0.0.1:8100/ready/liveness', timeout=10)"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 120s

  # Opt in with --profile learning; never shares inference ports or signing secrets.
  learning:
    profiles: ["learning"]
    # Alpine PHP www-data is UID/GID 82; share private files without widening access.
    user: "82:82"
    build:
      context: ./ai_service
      dockerfile: deploy/render/Dockerfile
      args:
        INSTALL_TEXT_BASELINE: "true"
        INSTALL_FACE_LIVENESS: "false"
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    network_mode: none
    environment:
      HOME: /tmp
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    command:
      - python
      - -m
      - src.ai_service.feedback_learning
      - --feedback
      - /learning/private/ai-learning/feedback.jsonl
      - --state-dir
      - /learning/private/ai-learning/candidate-state
      - --base-model
      - ${AI_LEARNING_BASE_MODEL_DIR:-/app/releases/category-experts-20261112-v1}
      - --min-new
      - "${AI_LEARNING_MIN_NEW:-50}"
      - --target-accuracy
      - "${AI_LEARNING_TARGET_ACCURACY:-0.8}"
      - --critical-recall
      - "${AI_LEARNING_CRITICAL_RECALL:-0.95}"
      - --min-cell
      - "${AI_LEARNING_MIN_CELL:-5}"
      - --train
      - --watch
      - --interval
      - "3600"
    volumes:
      - app-storage:/learning
    mem_limit: 768m
    cpus: 1.0

  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-rescue}
      MARIADB_USER: ${DB_USERNAME:?Set DB_USERNAME in Dokploy}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in Dokploy}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in Dokploy}
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  app-storage:
  mariadb-data:
